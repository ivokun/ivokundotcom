name: Deploy CMS

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/deploy-cms.yml'
  workflow_dispatch:

env:
  DEPLOY_DIR: /opt/cms

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2
        with:
          bun-version: '1.1.38'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Build SPA
        run: bun run build:spa

      - name: Compile binary for linux-x64
        run: |
          mkdir -p dist
          bun build src/server.ts \
            --compile \
            --target=bun-linux-x64 \
            --outfile dist/cms \
            --sourcemap=linked \
            --external sharp

      - name: Prepare deploy package
        run: |
          # Copy admin SPA
          cp -r public dist/public

          # Copy migrations
          mkdir -p dist/db
          cp -r db/migrations dist/db/migrations

          # Install external deps marked with --external in the compile step
          cd dist
          echo '{"dependencies":{"sharp":"^0.34.5"}}' > package.json
          bun install --production
          rm -f package.json bun.lock

      # SEC: Use env block for secrets instead of direct ${{ secrets.* }} interpolation
      # to prevent command injection via special characters in secret values
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to orbit001
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -avz --delete \
            --chown=cms:cms \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${{ env.DEPLOY_DIR }}/"

      - name: Fix database ownership
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" << 'EOF'
          sudo -u postgres psql -d cms -c "
            DO \$\$ 
            DECLARE 
              r RECORD; 
            BEGIN 
              FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP 
                EXECUTE 'ALTER TABLE public.' || quote_ident(r.tablename) || ' OWNER TO cms'; 
              END LOOP; 
              FOR r IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public' LOOP 
                EXECUTE 'ALTER SEQUENCE public.' || quote_ident(r.sequencename) || ' OWNER TO cms'; 
              END LOOP;
              FOR r IN SELECT typname FROM pg_type JOIN pg_namespace ON pg_namespace.oid = pg_type.typnamespace WHERE nspname = 'public' LOOP
                BEGIN
                  EXECUTE 'ALTER TYPE public.' || quote_ident(r.typname) || ' OWNER TO cms';
                EXCEPTION WHEN OTHERS THEN
                  -- Ignore types that can't have ownership changed (e.g. built-ins)
                END;
              END LOOP;
            END \$\$;
          "
          EOF

      - name: Run database migrations
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Install dbmate on CI runner
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

          # Open SSH tunnel to orbit001 postgres
          ssh -i ~/.ssh/deploy_key -f -N -L 15432:localhost:5432 \
            "${DEPLOY_USER}@${DEPLOY_HOST}"

          # Parse and fix URL escaping for dbmate
          export SAFE_DB_URL="$(RAW_URL="$DATABASE_URL" bun -e "
            const url = new URL(process.env.RAW_URL);
            try { url.password = encodeURIComponent(decodeURIComponent(url.password)); }
            catch { url.password = encodeURIComponent(url.password); }
            url.port = '15432';
            url.searchParams.set('sslmode', 'disable');
            process.stdout.write(url.toString());
          ")"

          # Mark initial schema as applied (database already has tables)
          DATABASE_URL="$SAFE_DB_URL" bun -e "
            import { Client } from 'pg';
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query('CREATE TABLE IF NOT EXISTS schema_migrations (version VARCHAR(128) PRIMARY KEY)');
            await client.query('INSERT INTO schema_migrations (version) VALUES (\'20251204164209\') ON CONFLICT DO NOTHING');
            await client.end();
          "

          # Run new migrations through the tunnel
          DATABASE_URL="$SAFE_DB_URL" dbmate -d db/migrations --no-dump-schema up

          # Close SSH tunnel
          pkill -f "ssh.*-L 15432" || true

      - name: Ensure CORS_ORIGIN in service env
        # SEC-001 (docs/issues/01-security.md) now hard-fails startup in
        # production without a specific CORS_ORIGIN. The prod env file
        # historically had none (CMS ran wildcard without anyone noticing),
        # so set it idempotently before restarting the service.
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' << 'EOF'
            set -eu
            ORIGIN_VALUE="CORS_ORIGIN=https://ivokun.com"

            # 1. Immediate: append to the sops-nix env file. Note: /run/secrets
            #    is regenerated at boot, so this alone is NOT durable.
            ENV_FILE="/run/secrets/vars/cms/cms.env"
            if sudo cat "$ENV_FILE" | grep -q '^CORS_ORIGIN='; then
              echo "env file already has CORS_ORIGIN - leaving as-is"
              sudo cat "$ENV_FILE" | grep '^CORS_ORIGIN='
            else
              echo "$ORIGIN_VALUE" | sudo tee -a "$ENV_FILE"
              echo "appended CORS_ORIGIN to $ENV_FILE"
            fi

            # 2. Durable-on-NixOS: /etc/systemd/system is READ-ONLY on NixOS
            #    (declaratively managed), so a drop-in usually cannot be
            #    written here. Try, but never fail the deploy over it - the
            #    real persistent fix is CORS_ORIGIN in the sops plaintext.
            DROP_DIR="/etc/systemd/system/cms.service.d"
            DROP_FILE="$DROP_DIR/cors-origin.conf"
            if [ -f "$DROP_FILE" ] && grep -q '^CORS_ORIGIN=' "$DROP_FILE"; then
              echo "drop-in already present - leaving as-is"
            else
              if sudo mkdir -p "$DROP_DIR" 2>/dev/null \
                 && printf '[Service]\nEnvironment="%s"\n' "$ORIGIN_VALUE" | sudo tee "$DROP_FILE" >/dev/null 2>&1 \
                 && sudo systemctl daemon-reload 2>/dev/null; then
                echo "wrote $DROP_FILE"
              else
                echo "WARN: could not write systemd drop-in ($DROP_DIR read-only on NixOS) - "
                echo "      relying on env-file edit; add CORS_ORIGIN to the sops plaintext for durability."
              fi
            fi
          EOF

      - name: Restart CMS service
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'chmod +x /opt/cms/cms && systemctl restart cms'

      - name: Health check (post-deploy)
        # Refusing a "green" deploy when the service is dead. Without this,
        # a failing binary (e.g. the SEC-001 CORS_ORIGIN fail-fast) dies
        # silently after restart and the workflow still reports success.
        env:
          HEALTH_URL: ${{ secrets.CMS_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://cms.ivokun.com/health}"
          ready=0
          for i in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || true)"
            if [ "$code" = "200" ]; then
              echo "ok: /health 200 (attempt $i)"
              ready=1
              break
            fi
            echo "waiting: /health -> ${code:-no-response} (attempt $i/15)"
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::CMS did not become healthy after deploy (last: $code)."
            echo "::error::If the log shows CORS_ORIGIN fail-fast, set CORS_ORIGIN in the service EnvironmentFile on ${DEPLOY_HOST}."
            echo "FETCHING JOURNAL: the remote journalctl may still be readable from the runner:"
            ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'sudo journalctl -u cms -n 30 --no-pager || journalctl -u cms -n 30 --no-pager' || true
            exit 1
          fi

      # SEC: Always clean up SSH key, even if previous steps fail
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
